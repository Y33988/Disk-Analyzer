name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  JAVA_VERSION: '21'
  JAVA_DISTRO: 'temurin'
  JAVAFX_VERSION: '21.0.6'
  APP_NAME: 'DiskAnalyzer'
  APP_VERSION: ${{ github.ref_name }}

jobs:
  build:
    name: Build on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows-x64
            javafx-classifier: 'windows'
            jpackage-type: 'exe'
            jpackage-args: '--win-dir-chooser --win-menu --win-shortcut'
            artifact-ext: 'exe'
          - os: macos-latest
            platform: macOS-aarch64
            javafx-classifier: 'mac-aarch64'
            jpackage-type: 'dmg'
            jpackage-args: ''
            artifact-ext: 'dmg'
          - os: ubuntu-latest
            platform: Linux-x64
            javafx-classifier: 'linux'
            jpackage-type: 'deb'
            jpackage-args: '--linux-deb-maintainer "DiskAnalyzer Team" --linux-shortcut'
            artifact-ext: 'deb'

    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}

      - name: Verify JDK
        shell: bash
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Download JavaFX SDK
        shell: bash
        run: |
          curl -L -o javafx.zip "https://download2.gluonhq.com/openjfx/${{ env.JAVAFX_VERSION }}/openjfx-${{ env.JAVAFX_VERSION }}_${{ matrix.javafx-classifier }}-sdk.zip"
          unzip -q javafx.zip
          echo "JAVAFX_PATH=$(pwd)/javafx-sdk-${{ env.JAVAFX_VERSION }}" >> $GITHUB_ENV

      - name: Compile Java sources
        shell: bash
        run: |
          mkdir -p target/classes
          cp -r src/main/resources/* target/classes/
          javac -d target/classes \
            --module-path "$JAVAFX_PATH/lib" \
            --add-modules javafx.controls,javafx.fxml \
            $(find src/main/java -name "*.java")

      - name: Create JAR
        shell: bash
        run: |
          jar cfe target/DiskAnalyzer.jar com.diskanalyzer.GlassDiskAnalyzerApp -C target/classes .

      - name: Create custom JRE with jlink
        shell: bash
        run: |
          jlink \
            --module-path "$JAVAFX_PATH/lib:$JAVA_HOME/jmods" \
            --add-modules java.base,java.desktop,java.logging,java.prefs,java.xml,javafx.controls,javafx.fxml,javafx.graphics,javafx.base \
            --output build/jre \
            --compress=2 \
            --strip-debug \
            --no-header-files \
            --no-man-pages

      - name: Package with jpackage
        shell: bash
        run: |
          mkdir -p build/pkg
          if [ "${{ runner.os }}" = "Windows" ]; then
            jpackage --type ${{ matrix.jpackage-type }} \
              --name ${{ env.APP_NAME }} \
              --input target \
              --main-jar DiskAnalyzer.jar \
              --runtime-image build/jre \
              --dest build/pkg \
              --app-version ${{ env.APP_VERSION }} \
              --vendor "DiskAnalyzer Team" \
              --description "Disk Space Analyzer - Liquid Glass Edition" \
              ${{ matrix.jpackage-args }}
          else
            jpackage --type ${{ matrix.jpackage-type }} \
              --name ${{ env.APP_NAME }} \
              --input target \
              --main-jar DiskAnalyzer.jar \
              --runtime-image build/jre \
              --dest build/pkg \
              --app-version ${{ env.APP_VERSION }} \
              --vendor "DiskAnalyzer Team" \
              --description "Disk Space Analyzer - Liquid Glass Edition" \
              ${{ matrix.jpackage-args }}
          fi

      - name: Rename artifact
        shell: bash
        run: |
          cd build/pkg
          if [ "${{ runner.os }}" = "Windows" ]; then
            for f in *.exe; do
              mv "$f" "DiskAnalyzer-${{ env.APP_VERSION }}-${{ matrix.platform }}.exe"
            done
          elif [ "${{ runner.os }}" = "macOS" ]; then
            for f in *.dmg; do
              mv "$f" "DiskAnalyzer-${{ env.APP_VERSION }}-${{ matrix.platform }}.dmg"
            done
          else
            for f in *.deb; do
              mv "$f" "DiskAnalyzer-${{ env.APP_VERSION }}-${{ matrix.platform }}.deb"
            done
          fi
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskAnalyzer-${{ env.APP_VERSION }}-${{ matrix.platform }}
          path: build/pkg/*
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: |
          echo "=== Artifacts ==="
          find artifacts/ -type f -ls

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
