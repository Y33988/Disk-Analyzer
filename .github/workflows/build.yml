name: Build All Platforms

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: Windows-x64
            javafx-url: "https://download2.gluonhq.com/openjfx/25.0.3/openjfx-25.0.3_windows-x64_bin-sdk.zip"
            jdk-url: "https://download.java.net/java/GA/jdk25.0.3/95548e8c5e4b4d99a548cd2e77f99c99/9/GPL/openjdk-25.0.3_windows-x64_bin.zip"
            jdk-ext: "zip"
          - os: macos-latest
            platform: macOS-aarch64
            javafx-url: "https://download2.gluonhq.com/openjfx/25.0.3/openjfx-25.0.3_osx-aarch64_bin-sdk.zip"
            jdk-url: "https://download.java.net/java/GA/jdk25.0.3/95548e8c5e4b4d99a548cd2e77f99c99/9/GPL/openjdk-25.0.3_macos-aarch64_bin.tar.gz"
            jdk-ext: "tar.gz"
          - os: ubuntu-latest
            platform: Linux-x64
            javafx-url: "https://download2.gluonhq.com/openjfx/25.0.3/openjfx-25.0.3_linux-x64_bin-sdk.zip"
            jdk-url: "https://download.java.net/java/GA/jdk25.0.3/95548e8c5e4b4d99a548cd2e77f99c99/9/GPL/openjdk-25.0.3_linux-x64_bin.tar.gz"
            jdk-ext: "tar.gz"

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 25 (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          curl -L -o jdk.zip "${{ matrix.jdk-url }}"
          Expand-Archive -Path jdk.zip -DestinationPath jdk25
          $jdkDir = Get-ChildItem -Path jdk25 -Directory | Select-Object -First 1
          Move-Item -Path "jdk25/$($jdkDir.Name)/*" -Destination jdk25 -Force
          echo "JAVA_HOME=$(Get-Location)\jdk25" >> $env:GITHUB_ENV
          echo "$(Get-Location)\jdk25\bin" >> $env:GITHUB_PATH
          java -version

      - name: Setup JDK 25 (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          curl -L -o jdk.tar.gz "${{ matrix.jdk-url }}"
          mkdir -p jdk25
          tar xzf jdk.tar.gz -C jdk25 --strip-components=1
          echo "JAVA_HOME=$(pwd)/jdk25" >> $GITHUB_ENV
          echo "$(pwd)/jdk25/bin" >> $GITHUB_PATH
          java -version

      - name: Download JavaFX SDK (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          curl -L -o javafx.zip "${{ matrix.javafx-url }}"
          Expand-Archive -Path javafx.zip -DestinationPath .
          echo "JAVAFX_PATH=$(Get-Location)\javafx-sdk-25.0.3" >> $env:GITHUB_ENV

      - name: Download JavaFX SDK (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          curl -L -o javafx.zip "${{ matrix.javafx-url }}"
          unzip -q javafx.zip
          echo "JAVAFX_PATH=$(pwd)/javafx-sdk-25.0.3" >> $GITHUB_ENV

      - name: Compile Java sources
        shell: bash
        run: |
          mkdir -p target/classes
          cp -r src/main/resources/* target/classes/
          javac -d target/classes \
            --module-path "$JAVAFX_PATH/lib" \
            --add-modules javafx.controls,javafx.fxml \
            $(find src/main/java -name "*.java")

      - name: Create JAR
        shell: bash
        run: |
          jar cfe target/DiskAnalyzer.jar com.diskanalyzer.GlassDiskAnalyzerApp -C target/classes .

      - name: Create custom JRE with jlink
        shell: bash
        run: |
          jlink \
            --module-path "$JAVAFX_PATH/lib:$JAVA_HOME/jmods" \
            --add-modules java.base,java.desktop,java.logging,java.prefs,java.xml,javafx.controls,javafx.fxml,javafx.graphics,javafx.base \
            --output build/jre \
            --compress=2 \
            --strip-debug \
            --no-header-files \
            --no-man-pages

      - name: Install WiX Toolset (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.0
          dotnet-wix --version

      - name: Package with jpackage (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          mkdir -p build/pkg
          jpackage --type app-image `
            --name DiskAnalyzer `
            --input target `
            --main-jar DiskAnalyzer.jar `
            --runtime-image build/jre `
            --dest build/pkg

      - name: Package with jpackage (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir -p build/pkg
          jpackage --type dmg \
            --name DiskAnalyzer \
            --input target \
            --main-jar DiskAnalyzer.jar \
            --runtime-image build/jre \
            --dest build/pkg

      - name: Package with jpackage (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y fakeroot dpkg
          mkdir -p build/pkg
          jpackage --type deb \
            --name DiskAnalyzer \
            --input target \
            --main-jar DiskAnalyzer.jar \
            --runtime-image build/jre \
            --dest build/pkg \
            --linux-deb-maintainer "Y33988"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskAnalyzer-v3.0-${{ matrix.platform }}
          path: |
            build/pkg/
            install*
            INSTALL.md
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
