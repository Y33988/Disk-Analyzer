name: Build All Platforms

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: Windows-x64
            archive-ext: zip
          - os: macos-latest
            platform: macOS-aarch64
            archive-ext: dmg
          - os: ubuntu-latest
            platform: Linux-x64
            archive-ext: deb

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: oracle-actions/setup-java@v1
        with:
          website: jdk.java.net
          release: 25

      - name: Download JavaFX SDK
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            curl -L "https://download2.gluonhq.com/openjfx/25.0.3/openjfx-25.0.3_windows-x64_bin-sdk.zip" -o javafx.zip
            unzip javafx.zip
            echo "JAVAFX_PATH=$(pwd)/javafx-sdk-25.0.3" >> $GITHUB_ENV
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            curl -L "https://download2.gluonhq.com/openjfx/25.0.3/openjfx-25.0.3_osx-aarch64_bin-sdk.zip" -o javafx.zip
            unzip javafx.zip
            echo "JAVAFX_PATH=$(pwd)/javafx-sdk-25.0.3" >> $GITHUB_ENV
          else
            curl -L "https://download2.gluonhq.com/openjfx/25.0.3/openjfx-25.0.3_linux-x64_bin-sdk.zip" -o javafx.zip
            unzip javafx.zip
            echo "JAVAFX_PATH=$(pwd)/javafx-sdk-25.0.3" >> $GITHUB_ENV
          fi

      - name: Compile Java sources
        shell: bash
        run: |
          mkdir -p target/classes
          cp -r src/main/resources/* target/classes/
          javac -d target/classes \
            --module-path "$JAVAFX_PATH/lib" \
            --add-modules javafx.controls,javafx.fxml \
            $(find src/main/java -name "*.java")

      - name: Create JAR
        shell: bash
        run: |
          jar cfe target/DiskAnalyzer.jar com.diskanalyzer.GlassDiskAnalyzerApp -C target/classes .

      - name: Create custom JRE with jlink
        shell: bash
        run: |
          JAVA_HOME="${{ runner.tool_cache }}/jdk-25" || JAVA_HOME=$(dirname $(dirname $(which java)))
          jlink \
            --module-path "$JAVAFX_PATH/lib:${JAVA_HOME}/jmods" \
            --add-modules java.base,java.desktop,java.logging,java.prefs,java.xml,javafx.controls,javafx.fxml,javafx.graphics,javafx.base \
            --output build/jre \
            --compress=2 \
            --strip-debug \
            --no-header-files \
            --no-man-pages

      - name: Package with jpackage
        shell: bash
        run: |
          mkdir -p build/pkg
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            jpackage --type app-image \
              --name DiskAnalyzer \
              --input target \
              --main-jar DiskAnalyzer.jar \
              --runtime-image build/jre \
              --dest build/pkg
            7z a "build/DiskAnalyzer-v3.0-${{ matrix.platform }}.zip" "build/pkg/DiskAnalyzer"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            jpackage --type dmg \
              --name DiskAnalyzer \
              --input target \
              --main-jar DiskAnalyzer.jar \
              --runtime-image build/jre \
              --dest build/pkg
          else
            jpackage --type deb \
              --name DiskAnalyzer \
              --input target \
              --main-jar DiskAnalyzer.jar \
              --runtime-image build/jre \
              --dest build/pkg \
              --linux-deb-maintainer "Y33988"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskAnalyzer-v3.0-${{ matrix.platform }}
          path: build/pkg/
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
