name: Build All Platforms

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  JAVA_VERSION: '21'
  APP_NAME: 'DiskAnalyzer'

jobs:
  build:
    name: Build on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows-x64
            jpackage-type: 'exe'
            jpackage-args: '--win-dir-chooser --win-menu --win-shortcut'
          - os: macos-latest
            platform: macOS-aarch64
            jpackage-type: 'dmg'
            jpackage-args: ''
          - os: ubuntu-latest
            platform: Linux-x64
            jpackage-type: 'deb'
            jpackage-args: '--linux-deb-maintainer "DiskAnalyzer Team" --linux-shortcut'

    steps:
      - uses: actions/checkout@v5

      - name: Setup Liberica JDK (with JavaFX)
        uses: bell-sw/liberica-runtime-actions@main
        with:
          java-version: ${{ env.JAVA_VERSION }}
          java-package: jdk-full
          cache: maven

      - name: Verify JDK and JavaFX
        shell: bash
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"
          ls -la "$JAVA_HOME/jmods" | grep javafx || true

      - name: Compile Java sources
        shell: bash
        run: |
          mkdir -p target/classes
          cp -r src/main/resources/* target/classes/
          javac -d target/classes \
            --module-path "$JAVA_HOME/jmods" \
            --add-modules javafx.controls,javafx.fxml \
            $(find src/main/java -name "*.java")

      - name: Create JAR
        shell: bash
        run: |
          jar cfe target/DiskAnalyzer.jar com.diskanalyzer.GlassDiskAnalyzerApp -C target/classes .

      - name: Create custom JRE with jlink
        shell: bash
        run: |
          jlink \
            --module-path "$JAVA_HOME/jmods" \
            --add-modules java.base,java.desktop,java.logging,java.prefs,java.xml,javafx.controls,javafx.fxml,javafx.graphics,javafx.base \
            --output build/jre \
            --compress=2 \
            --strip-debug \
            --no-header-files \
            --no-man-pages

      - name: Package with jpackage
        shell: bash
        run: |
          mkdir -p build/pkg
          jpackage --type ${{ matrix.jpackage-type }} \
            --name ${{ env.APP_NAME }} \
            --input target \
            --main-jar DiskAnalyzer.jar \
            --runtime-image build/jre \
            --dest build/pkg \
            --app-version 3.0 \
            --vendor "DiskAnalyzer Team" \
            --description "Disk Space Analyzer - Liquid Glass Edition" \
            ${{ matrix.jpackage-args }}

      - name: Rename artifact
        shell: bash
        run: |
          cd build/pkg
          if [ "${{ runner.os }}" = "Windows" ]; then
            for f in *.exe; do
              mv "$f" "DiskAnalyzer-3.0-${{ matrix.platform }}.exe"
            done
          elif [ "${{ runner.os }}" = "macOS" ]; then
            for f in *.dmg; do
              mv "$f" "DiskAnalyzer-3.0-${{ matrix.platform }}.dmg"
            done
          else
            for f in *.deb; do
              mv "$f" "DiskAnalyzer-3.0-${{ matrix.platform }}.deb"
            done
          fi
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskAnalyzer-3.0-${{ matrix.platform }}
          path: build/pkg/*
          retention-days: 30
