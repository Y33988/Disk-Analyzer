name: Build All Platforms

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  JAVA_VERSION: '21'
  JAVA_DISTRO: 'temurin'
  JAVAFX_VERSION: '21.0.6'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: Windows-x64
            javafx-classifier: 'windows'
          - os: macos-latest
            platform: macOS-aarch64
            javafx-classifier: 'mac-aarch64'
          - os: ubuntu-latest
            platform: Linux-x64
            javafx-classifier: 'linux'

    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}

      - name: Verify JDK
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Download JavaFX SDK
        shell: bash
        run: |
          curl -L -o javafx.zip "https://download2.gluonhq.com/openjfx/${{ env.JAVAFX_VERSION }}/openjfx-${{ env.JAVAFX_VERSION }}_${{ matrix.javafx-classifier }}-sdk.zip"
          unzip -q javafx.zip
          echo "JAVAFX_PATH=$(pwd)/javafx-sdk-${{ env.JAVAFX_VERSION }}" >> $GITHUB_ENV

      - name: Compile Java sources
        shell: bash
        run: |
          mkdir -p target/classes
          cp -r src/main/resources/* target/classes/
          javac -d target/classes \
            --module-path "$JAVAFX_PATH/lib" \
            --add-modules javafx.controls,javafx.fxml \
            $(find src/main/java -name "*.java")

      - name: Create JAR
        shell: bash
        run: |
          jar cfe target/DiskAnalyzer.jar com.diskanalyzer.GlassDiskAnalyzerApp -C target/classes .

      - name: Create custom JRE with jlink
        shell: bash
        run: |
          jlink \
            --module-path "$JAVAFX_PATH/lib:$JAVA_HOME/jmods" \
            --add-modules java.base,java.desktop,java.logging,java.prefs,java.xml,javafx.controls,javafx.fxml,javafx.graphics,javafx.base \
            --output build/jre \
            --compress=2 \
            --strip-debug \
            --no-header-files \
            --no-man-pages

      - name: Install WiX Toolset (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.*
          echo "C:\Users\runneradmin\.dotnet\tools" >> $env:GITHUB_PATH
          wix --version

      - name: Package with jpackage (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -Path build/pkg -ItemType Directory -Force
          jpackage --type app-image `
            --name DiskAnalyzer `
            --input target `
            --main-jar DiskAnalyzer.jar `
            --runtime-image build/jre `
            --dest build/pkg

      - name: Package with jpackage (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p build/pkg
          jpackage --type dmg \
            --name DiskAnalyzer \
            --input target \
            --main-jar DiskAnalyzer.jar \
            --runtime-image build/jre \
            --dest build/pkg

      - name: Package with jpackage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y fakeroot dpkg
          mkdir -p build/pkg
          jpackage --type deb \
            --name DiskAnalyzer \
            --input target \
            --main-jar DiskAnalyzer.jar \
            --runtime-image build/jre \
            --dest build/pkg \
            --linux-deb-maintainer "Y33988"

      - name: List build output
        shell: bash
        run: |
          echo "=== Build contents ==="
          ls -la build/pkg/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskAnalyzer-v3.0-${{ matrix.platform }}
          path: build/pkg/
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        shell: bash
        run: |
          echo "=== Artifacts ==="
          find artifacts/ -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
